<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C-HAWQ — Organizational Overview & Advisor Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600;700;800;900&family=Source+Sans+3:wght@400;600;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ===== FLIPBOOK SHELL ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #2c2c2c;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Source Sans 3', sans-serif;
  user-select: none;
  overflow: hidden;
}

/* Toolbar */
#toolbar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 60px;
  background: rgba(20,20,20,0.97);
  backdrop-filter: blur(12px);
  border-top: 1px solid rgba(72,197,227,0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  z-index: 1000;
  padding: 0 20px;
}

.tb-btn {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.14);
  color: #fff;
  padding: 7px 16px;
  border-radius: 7px;
  font-family: 'Source Code Pro', monospace;
  font-size: 12px;
  letter-spacing: 0.05em;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.tb-btn:hover { background: rgba(72,197,227,0.18); border-color: rgba(72,197,227,0.45); }
.tb-btn:active { transform: scale(0.96); }
.tb-btn.primary { background: #1f396d; border-color: #2a4a86; }

#slide-counter {
  font-family: 'Source Code Pro', monospace;
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  min-width: 55px;
  text-align: center;
}

#slide-label {
  font-family: 'Source Code Pro', monospace;
  font-size: 11px;
  color: #48c5e3;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  max-width: 300px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* TOC overlay — all selectors prefixed with #toc-overlay to avoid deck CSS conflicts */
#toc-overlay {
  position: fixed;
  inset: 0;
  background: rgba(18,18,18,0.97);
  backdrop-filter: blur(16px);
  z-index: 2000;
  display: none;
  overflow-y: auto;
  padding: 56px 40px 90px;
}
#toc-overlay.open { display: block; }

#toc-overlay h2 {
  font-family: 'Jost', sans-serif;
  font-weight: 900;
  font-size: 26px;
  color: #fff !important;
  margin-bottom: 28px;
  text-align: center;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

#toc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 10px;
  max-width: 1200px;
  margin: 0 auto;
}

/* Namespaced to avoid conflict with deck .toc-item */
#toc-overlay .ftoc-item {
  background: rgba(255,255,255,0.05) !important;
  border: 1px solid rgba(255,255,255,0.1) !important;
  border-radius: 9px !important;
  padding: 14px 18px !important;
  cursor: pointer !important;
  transition: all 0.15s !important;
  display: flex !important;
  align-items: center !important;
  gap: 12px !important;
  color: rgba(255,255,255,0.85) !important;
  text-decoration: none !important;
}
#toc-overlay .ftoc-item:hover {
  background: rgba(72,197,227,0.12) !important;
  border-color: rgba(72,197,227,0.35) !important;
}
#toc-overlay .ftoc-num {
  font-family: 'Source Code Pro', monospace !important;
  font-size: 11px !important;
  color: #48c5e3 !important;
  letter-spacing: 0.1em !important;
  min-width: 26px !important;
  flex-shrink: 0 !important;
}
#toc-overlay .ftoc-name {
  font-family: 'Source Sans 3', sans-serif !important;
  font-size: 13px !important;
  color: rgba(255,255,255,0.82) !important;
  line-height: 1.3 !important;
}

/* Stage */
#stage {
  width: 100vw;
  height: calc(100vh - 60px);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

#slide-wrapper {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.slide-frame {
  position: absolute;
  width: 1920px;
  height: 1080px;
  transform-origin: center center;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
}

.slide-frame.entering {
  animation: slideIn 0.28s ease forwards;
}

@keyframes slideIn {
  from { opacity: 0; transform: scale(var(--sf, 1)) translateX(48px); }
  to   { opacity: 1; transform: scale(var(--sf, 1)) translateX(0); }
}

/* Progress bar */
#progress {
  position: fixed;
  top: 0; left: 0;
  height: 3px;
  background: linear-gradient(90deg, #48c5e3, #3f886c);
  transition: width 0.3s ease;
  z-index: 999;
}

#kb-hint {
  position: fixed;
  top: 14px; right: 16px;
  font-family: 'Source Code Pro', monospace;
  font-size: 10px;
  color: rgba(255,255,255,0.22);
  letter-spacing: 0.08em;
  z-index: 500;
  pointer-events: none;
}

/* ===== DECK CSS ===== */
:root {
  /* Brand */
  --chawq-main-blue: #1f396d;
  --chawq-main-blue-900: #142749;
  --chawq-main-blue-800: #1a3160;
  --chawq-main-blue-600: #2a4a86;
  --chawq-main-blue-500: #3a5ea0;
  --chawq-main-blue-300: #7a90bb;
  --chawq-main-blue-100: #d7dfee;
  --chawq-main-blue-050: #eef2f9;
  --chawq-green: #3f886c;
  --chawq-green-900: #255241;
  --chawq-green-500: #5ba988;
  --chawq-green-100: #deece5;
  --chawq-green-050: #eff6f2;
  --chawq-sky: #48c5e3;
  --chawq-sky-900: #1d7c94;
  --chawq-sky-700: #2aa3c2;
  --chawq-sky-100: #d0eff7;
  --chawq-sky-050: #ebf8fc;
  --chawq-ink: #0e1a33;
  --chawq-fg-1: #152545;
  --chawq-fg-2: #3c4a66;
  --chawq-fg-3: #65728c;
  --chawq-fg-muted: #8a94a9;
  --chawq-line: #d9dde6;
  --chawq-line-soft: #e8ebf1;
  --chawq-surface-1: #f7f8fb;
  --chawq-surface-2: #f2f4f8;
  --chawq-paper: #ffffff;
  --chawq-on-blue-1: #ffffff;
  --chawq-on-blue-2: #d7dfee;
  --chawq-on-blue-3: #9aaacb;
  --chawq-danger: #b4331f;
  --chawq-success: #3f886c;
  --chawq-info: #1d7c94;

  --font-display: 'Jost', 'Futura PT', 'Century Gothic', sans-serif;
  --font-body: 'Source Sans 3', 'Source Sans Pro', system-ui, sans-serif;
  --font-mono: 'Source Code Pro', 'Roboto Mono', monospace;

  /* Deck-specific type scale (1920x1080) */
  --type-display: 140px;
  --type-hero: 200px;
  --type-title: 64px;
  --type-subtitle: 44px;
  --type-h3: 34px;
  --type-lead: 30px;
  --type-body: 26px;
  --type-small: 22px;
  --type-eyebrow: 20px;
  --type-mono: 22px;
  --type-table: 22px;

  --pad-x: 110px;
  --pad-top: 90px;
  --pad-bottom: 80px;
  --gap-title: 44px;
  --gap-item: 24px;
}

/* deck-stage takes care of sizing */
deck-stage > section {
  font-family: var(--font-body);
  font-size: var(--type-body);
  line-height: 1.45;
  color: var(--chawq-fg-1);
  background: var(--chawq-paper);
  overflow: hidden;
  box-sizing: border-box;
}

/* ---- Common slide frame ---- */
.slide {
  width: 100%;
  height: 100%;
  padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  position: relative;
}
.slide.blue { background: var(--chawq-main-blue); color: var(--chawq-on-blue-1); }
.slide.surface { background: var(--chawq-surface-1); }
.slide.green { background: var(--chawq-green); color: #fff; }

/* Chrome: logo bottom-right, page label bottom-left */
.chrome-logo {
  position: absolute;
  bottom: 40px;
  right: 56px;
  width: 56px;
  height: 56px;
  opacity: 0.9;
}
.chrome-logo img { width: 100%; height: 100%; object-fit: contain; }
.chrome-page {
  position: absolute;
  bottom: 48px;
  left: 56px;
  font-family: var(--font-mono);
  font-size: 18px;
  letter-spacing: 0.1em;
  color: var(--chawq-fg-3);
  text-transform: uppercase;
}
.slide.blue .chrome-page { color: var(--chawq-on-blue-3); }
.slide.green .chrome-page { color: rgba(255,255,255,0.7); }

/* Section marker (big section pill for navigation) */
.section-mark {
  display: inline-flex;
  align-items: center;
  gap: 18px;
  margin: 0 0 32px;
  padding: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 26px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--chawq-fg-2);
}
.section-mark .num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--chawq-main-blue);
  color: #fff;
  min-width: 76px;
  height: 56px;
  padding: 0 20px;
  border-radius: 10px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 32px;
  letter-spacing: 0;
}
.section-mark .title-text { color: var(--chawq-main-blue); font-weight: 700; }
.slide.blue .section-mark { color: var(--chawq-on-blue-2); }
.slide.blue .section-mark .num { background: var(--chawq-sky); color: var(--chawq-main-blue-900); }
.slide.blue .section-mark .title-text { color: #fff; }

/* Eyebrow above titles */
.eyebrow {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--type-eyebrow);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--chawq-sky-900);
  margin: 0 0 18px;
}
.slide.blue .eyebrow { color: var(--chawq-sky); }
.slide.green .eyebrow { color: rgba(255,255,255,0.85); }

/* Headings */
h1.slide-title, h2.slide-title {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: var(--type-title);
  line-height: 1.05;
  letter-spacing: -0.01em;
  color: var(--chawq-main-blue);
  margin: 0 0 var(--gap-title);
  text-wrap: balance;
}
.slide.blue h1.slide-title, .slide.blue h2.slide-title { color: #fff; }
.slide.green h1.slide-title, .slide.green h2.slide-title { color: #fff; }

h3.subtitle {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--type-subtitle);
  line-height: 1.1;
  color: var(--chawq-main-blue);
  margin: 0 0 24px;
}
.slide.blue h3.subtitle { color: #fff; }

/* Body text */
.body p { margin: 0 0 18px; font-size: var(--type-body); line-height: 1.5; color: var(--chawq-fg-1); }
.body p.lead { font-size: var(--type-lead); color: var(--chawq-fg-1); line-height: 1.4; }
.slide.blue .body p, .slide.blue .body p.lead { color: var(--chawq-on-blue-2); }
.slide.blue .body strong { color: #fff; }

ul.clean { list-style: none; padding: 0; margin: 0; }
ul.clean li { margin: 0 0 14px; font-size: var(--type-body); line-height: 1.5; }
ul.dot { padding-left: 0; list-style: none; }
ul.dot li { position: relative; padding-left: 32px; margin: 0 0 14px; }
ul.dot li::before { content: ""; position: absolute; left: 0; top: 14px; width: 10px; height: 10px; background: var(--chawq-sky); border-radius: 50%; }

/* ---- Cover ---- */
.cover {
  background: var(--chawq-main-blue);
  color: #fff;
  position: relative;
  overflow: hidden;
}
.cover .cover-photo {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  opacity: 0.35;
}
.cover .cover-gradient {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(20,39,73,0.55) 0%, rgba(20,39,73,0.85) 60%, var(--chawq-main-blue-900) 100%);
}
.cover .cover-inner {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; justify-content: space-between;
  height: 100%; padding: 90px 110px 90px;
}
.cover .cover-logo { width: 110px; height: 110px; }
.cover h1.title {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 104px;
  line-height: 0.95;
  letter-spacing: -0.02em;
  color: #fff;
  margin: 0 0 18px;
}
.cover .sub { font-family: var(--font-display); font-weight: 700; font-size: 56px; color: var(--chawq-sky); letter-spacing: -0.01em; margin: 0 0 36px; }
.cover .acronym {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 170px;
  letter-spacing: -0.04em;
  color: #fff;
  line-height: 0.9;
  margin: 0 0 28px;
}
.cover .meta { font-family: var(--font-mono); font-size: 22px; color: var(--chawq-on-blue-3); letter-spacing: 0.06em; text-transform: uppercase; }

/* ---- Big stat grid ---- */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 48px;
  width: 100%;
}
.stat .num {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 130px;
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--chawq-sky);
  margin: 0 0 12px;
  font-variant-numeric: tabular-nums;
}
.slide.blue .stat .num { color: var(--chawq-sky); }
.slide:not(.blue) .stat .num { color: var(--chawq-main-blue); }
.stat .lbl {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 24px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.85);
  line-height: 1.2;
}
.slide:not(.blue) .stat .lbl { color: var(--chawq-fg-2); }
.stat { border-top: 3px solid currentColor; padding-top: 28px; color: var(--chawq-sky); }
.slide:not(.blue) .stat { color: var(--chawq-main-blue); }

/* ---- TOC ---- */
.toc-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  column-gap: 100px;
  row-gap: 4px;
  margin-top: 8px;
}
.toc-item {
  display: grid;
  grid-template-columns: 80px 1fr;
  align-items: baseline;
  padding: 12px 0;
  border-bottom: 1px solid var(--chawq-line);
}
.toc-item .n {
  font-family: var(--font-mono);
  font-size: 24px;
  font-weight: 500;
  color: var(--chawq-sky-900);
  letter-spacing: 0.05em;
}
.toc-item .ttl {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 28px;
  color: var(--chawq-main-blue);
}

/* ---- Section divider ---- */
.section-divider .sec-num {
  font-family: var(--font-mono);
  font-size: 26px;
  letter-spacing: 0.12em;
  color: var(--chawq-sky);
  margin: 0 0 24px;
}
.section-divider h1 {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 140px;
  line-height: 0.95;
  letter-spacing: -0.02em;
  color: #fff;
  margin: 0;
  text-wrap: balance;
  max-width: 1500px;
}
.section-divider .sub {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 36px;
  color: var(--chawq-on-blue-2);
  margin: 32px 0 0;
  max-width: 1100px;
}

/* ---- 2 column ---- */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; flex: 1; align-content: start; }
.two-col-wide { display: grid; grid-template-columns: 1fr 1.4fr; gap: 80px; flex: 1; align-content: start; }
.three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 48px; flex: 1; align-content: start; }
.four-col { display: grid; grid-template-columns: repeat(4, 1fr); gap: 36px; flex: 1; align-content: start; }

/* ---- Numbered cards ---- */
.num-card {
  background: var(--chawq-surface-1);
  border-radius: 14px;
  padding: 32px;
  border-top: 3px solid var(--chawq-sky);
  display: flex; flex-direction: column;
  height: 100%;
}
.num-card .n {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 56px;
  color: var(--chawq-sky-900);
  line-height: 1;
  margin: 0 0 16px;
}
.num-card h4 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 28px;
  color: var(--chawq-main-blue);
  margin: 0 0 14px;
  line-height: 1.15;
}
.num-card p {
  font-size: 22px;
  line-height: 1.4;
  color: var(--chawq-fg-2);
  margin: 0;
}
.slide.blue .num-card {
  background: rgba(255,255,255,0.06);
  border-top-color: var(--chawq-sky);
  backdrop-filter: blur(4px);
}
.slide.blue .num-card h4 { color: #fff; }
.slide.blue .num-card p { color: var(--chawq-on-blue-2); }
.slide.blue .num-card .n { color: var(--chawq-sky); }

/* ---- Pillar full slide ---- */
.pillar-hero {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 60px;
  align-items: start;
}
.pillar-hero .pn {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 240px;
  line-height: 0.85;
  color: var(--chawq-sky);
  letter-spacing: -0.04em;
}
.pillar-hero h2 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 72px;
  color: var(--chawq-main-blue);
  margin: 0 0 32px;
  line-height: 1;
  letter-spacing: -0.01em;
}
.pillar-hero .sub-line {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 30px;
  color: var(--chawq-sky-900);
  margin: 0 0 28px;
}
.pillar-hero p {
  font-size: 24px;
  line-height: 1.5;
  color: var(--chawq-fg-1);
  margin: 0 0 16px;
}

/* ---- Tables ---- */
table.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--type-table);
}
table.data-table th {
  font-family: var(--font-display);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 16px;
  color: var(--chawq-fg-3);
  text-align: left;
  padding: 14px 16px;
  border-bottom: 2px solid var(--chawq-main-blue);
  white-space: nowrap;
}
table.data-table td {
  padding: 16px;
  border-bottom: 1px solid var(--chawq-line);
  color: var(--chawq-fg-1);
  vertical-align: top;
  line-height: 1.35;
}
table.data-table td.muni { font-weight: 600; color: var(--chawq-main-blue); }
table.data-table td.mono { font-family: var(--font-mono); font-size: 18px; }
table.data-table td.num { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
table.data-table tr.subhead td {
  background: var(--chawq-main-blue-050);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--chawq-main-blue);
  padding: 10px 16px;
}

/* ---- Team grid ---- */
.team-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 40px;
  align-content: start;
}
.team-grid.tg4 { grid-template-columns: repeat(4, 1fr); gap: 28px; }
.team-card {
  background: #fff;
  border: 1px solid var(--chawq-line);
  border-radius: 14px;
  overflow: hidden;
  display: flex; flex-direction: column;
}
.team-card .photo {
  width: 100%;
  aspect-ratio: 4 / 3;
  background: var(--chawq-surface-2);
  background-size: cover;
  background-position: center 30%;
}
.team-card .info {
  padding: 22px 24px 24px;
}
.team-card .name {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 26px;
  color: var(--chawq-main-blue);
  margin: 0 0 6px;
  line-height: 1.1;
}
.team-card .role {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 18px;
  color: var(--chawq-sky-900);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin: 0 0 14px;
}
.team-card .bio {
  font-size: 17px;
  line-height: 1.45;
  color: var(--chawq-fg-2);
  margin: 0;
}
.team-grid.tg4 .team-card .name { font-size: 22px; }
.team-grid.tg4 .team-card .role { font-size: 15px; margin-bottom: 10px; }
.team-grid.tg4 .team-card .bio { font-size: 15px; }
.team-grid.tg4 .team-card .info { padding: 18px 20px 20px; }

/* ---- Advisor grid (smaller, denser) ---- */

<section data-screen-label="07 The Place">
  <div class="slide">
    <div class="eyebrow">03 — Our Story · The Unbroken</div>
    <h2 class="slide-title" style="margin-bottom: 32px;">I.&nbsp;&nbsp;The Place</h2>

    <div style="columns: 2; column-gap: 72px; max-width: 1680px;">
        <p style="font-size: 26px; line-height: 1.6; color: var(--chawq-fg-1); margin: 0 0 22px; break-inside: avoid;">We feel lucky to call Marco Island home. What makes this place so special is the way we get to interact with the environment every single day — out on the boat, fishing off the dock, walking the beach at low tide. Our lives are lived on the water. That relationship was passed down to us, and we never took it for granted.</p>
        <p style="font-size: 26px; line-height: 1.6; color: var(--chawq-fg-1); margin: 0 0 22px; break-inside: avoid;">Slowly, then all at once, something changed. The water got darker. The fish thinned out. Neighbors started having the same conversation: something is wrong, and nobody seems to know what to do about it. For a long time, that felt like a local frustration. The more we looked, the more we understood it wasn't. The same decline was playing out up and down the Florida coast. A water quality crisis had been building for decades, and the path forward for most communities was nowhere in sight.</p>
        <p style="font-size: 26px; line-height: 1.6; color: var(--chawq-fg-1); margin: 0 0 22px; break-inside: avoid;">In 2021, that hunch became data. Environmental Research Design formally classified Marco Island's waterways as impaired. The cause: 70% of the pollutant load was coming from internal sediment recycling — the muck layered on the canal floors, slowly releasing nitrogen back into the water column. The recommended fix was hydraulic dredging. The estimated cost was $189 million. The city dismissed the idea before the conversation could start. At that price tag, it had to. The community was left to focus on the 30% of surface issues they could afford to touch, while the root cause continued its quiet work below.</p>
    </div>
    <div class="chrome-page">03 · The Place</div>
    <img class="chrome-logo" src="https://raw.githubusercontent.com/C-HAWQ/Website-images/Main/logos/White%20%20blue%20background%20symbol%20c-hawq.png" alt="">
  </div>
</section>

<!-- ============================================================
     03 — THE DIVE
============================================================ -->
<section data-screen-label="08 The Dive">
  <div class="slide surface">
    <div class="eyebrow">03 — Our Story · The Unbroken</div>
    <h2 class="slide-title" style="margin-bottom: 32px;">II.&nbsp;&nbsp;The Dive</h2>

    <div style="columns: 2; column-gap: 72px; max-width: 1680px;">
        <p style="font-size: 26px; line-height: 1.6; color: var(--chawq-fg-1); margin: 0 0 22px; break-inside: avoid;">We were not willing to accept that. We had spent years in this environment — in engineering, in construction, in the field — and we believed there was a better way. We proposed a circular dredging model: mechanically remove the sediment from the canal floors, transport it by barge, and use it to construct new habitat islands stabilized with native mangroves, seagrasses, and oyster reefs. The pollutant would become the filter. The cost would be a fraction of traditional hydraulic disposal. We were so confident in the approach that we offered to cover the initial engineering and grant work ourselves, eliminating any financial risk to the city.</p>
        <p style="font-size: 26px; line-height: 1.6; color: var(--chawq-fg-1); margin: 0 0 22px; break-inside: avoid;">The technical reception was warm. City council members were genuinely intrigued. And then, as the proposal moved forward, we walked into a minefield we had not anticipated.</p>
        <p style="font-size: 26px; line-height: 1.6; color: var(--chawq-fg-1); margin: 0 0 22px; break-inside: avoid;">Organized opposition reframed our work as a threat rather than a contribution. Misinformation moved faster than the science could. We found ourselves defending our motives instead of presenting our data, facing accusations that we were looking to profit off the city rather than help it. The political friction overwhelmed the process. The city withdrew support before we could present a single piece of evidence — before the studies we had offered to fund could even begin.</p>
        <p style="font-size: 26px; line-height: 1.6; color: var(--chawq-fg-1); margin: 0 0 22px; break-inside: avoid;">It was a hard loss. But sitting with it, something became clear: this was not a Marco Island problem. We had stumbled into a pattern that exists in nearly every Florida municipality. Even when the engineering is sound and the costs are lower, projects die — killed by the same three walls every time. No neutral, trusted science to anchor the conversation. No mechanism to absorb the upfront financial risk. And no structure that could earn community trust without raising questions about motive. These were not local failures. They were systemic ones. And no engineering firm, no matter how skilled, was built to solve them.</p>
    </div>
    <div class="chrome-page">03 · The Dive</div>
    <img class="chrome-logo" src="https://raw.githubusercontent.com/C-HAWQ/Website-images/Main/logos/White%20%20blue%20background%20symbol%20c-hawq.png" alt="">
  </div>
</section>

<section data-screen-label="09 The Flight">
  <div class="slide">
    <div class="eyebrow">03 — Our Story · The Unbroken</div>
    <h2 class="slide-title" style="margin-bottom: 32px;">III.&nbsp;&nbsp;The Flight</h2>

    <div style="columns: 2; column-gap: 72px; max-width: 1680px;">
        <p style="font-size: 26px; line-height: 1.6; color: var(--chawq-fg-1); margin: 0 0 22px; break-inside: avoid;">That understanding changed everything. We realized that to save Florida's water, we could not just be engineers with a good idea. We had to build an organization specifically designed to survive the conditions that had destroyed our first attempt — one that could provide the neutral science before the politics hardened, absorb the financial risk that paralyzes city councils, earn community trust without a profit motive in the room, and stay committed long after any single project would have been abandoned.</p>
        <p style="font-size: 26px; line-height: 1.6; color: var(--chawq-fg-1); margin: 0 0 22px; break-inside: avoid;">That is what C-HAWQ is. Not a response to Marco Island's failure, but something built from a clear understanding of why it failed.</p>
        <p style="font-size: 26px; line-height: 1.6; color: var(--chawq-fg-1); margin: 0 0 22px; break-inside: avoid;">The osprey does not guess. It climbs, watches, and when the moment is right, it commits. It does not circle twice. We built this organization with the same intent — to see clearly, to move precisely, and to not give up on the water that gave so much to us.</p>
        <p style="font-size: 26px; line-height: 1.6; color: var(--chawq-main-blue); font-weight: 600; margin: 0 0 22px; break-inside: avoid;">Florida has 2,201 impaired bodies of water. Most of the communities living beside them know something is wrong. What they have lacked — until now — is a trusted partner with the science, the resources, and the structure to help them do something about it.</p>
    </div>
    <div class="chrome-page">03 · The Flight</div>

  <div class="slide">

    <h2 class="slide-title" style="margin-bottom: 14px;">C-HAWQ was not built in a boardroom.</h2>
    <p style="font-size: 24px; color: var(--chawq-fg-2); max-width: 1500px; margin: 0 0 28px;">

    <h2 class="slide-title" style="font-size: 52px; max-width: 1600px;">"From Utility to Amenity: The Evolution of Residential Canals"</h2>
    <p style="font-size: 22px; color: var(--chawq-fg-2); max-width: 1600px; margin: -8px 0 28px;">
      C-HAWQ's inaugural peer-reviewed research paper provides the scientific and historical foundation for understanding why Florida's residential canals are failing — and why restoration is both necessary and achievable.
    </p>

    <div class="two-col">
      <div>
        <div style="font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--chawq-sky-900); margin-bottom: 14px;">Key Findings</div>
        <ul class="dot" style="font-size: 21px; line-height: 1.45;">
          <li>Florida's residential canals were constructed in the <strong>1950s–70s without modern environmental regulations</strong>, creating deep channels with critically low oxygen levels.</li>
          <li>Limited flushing causes canal basins to accumulate <strong>fine-grained, organic-rich "muck" sediments</strong> that store nitrogen and phosphorus — a persistent internal pollutant source.</li>
          <li>Canal degradation affects not just homeowners but <strong>downstream fisheries, public waters, and non-waterfront communities.</strong></li>
          <li>Because canal degradation is a consequence of design and governance rather than inevitability, it is <strong>at least partially reversible</strong> with targeted, science-based interventions.</li>
        </ul>
      </div>

const parser = new DOMParser();
const doc = parser.parseFromString('<div>' + SECTIONS_RAW + '</div>', 'text/html');
const sections = Array.from(doc.querySelectorAll('section[data-screen-label]'));
const labels = sections.map(s => s.getAttribute('data-screen-label'));
const htmlSlides = sections.map(s => s.outerHTML);

let currentSlide = 0;
let scaleFactor = 1;

// Build TOC
const tocGrid = document.getElementById('toc-grid');
labels.forEach((label, i) => {
  const div = document.createElement('div');
  div.className = 'ftoc-item';
  const parts = label.match(/^(\d+)\s(.+)$/);
  div.innerHTML = parts
    ? `<span class="ftoc-num">${parts[1]}</span><span class="ftoc-name">${parts[2]}</span>`
    : `<span class="ftoc-name">${label}</span>`;
  div.onclick = () => { goToSlide(i); closeToc(); };
  tocGrid.appendChild(div);
});

function getScaleFactor() {
  const stage = document.getElementById('stage');
  return Math.min(stage.clientWidth / 1920, stage.clientHeight / 1080);
}

function renderSlide(index) {
  const frame = document.getElementById('current-frame');
  frame.innerHTML = htmlSlides[index];
  scaleFactor = getScaleFactor();
  frame.style.transform = `scale(${scaleFactor})`;
  frame.style.setProperty('--sf', scaleFactor);
  frame.classList.remove('entering');
  void frame.offsetWidth;
  frame.classList.add('entering');
  frame.addEventListener('animationend', () => frame.classList.remove('entering'), {once:true});

  document.getElementById('slide-counter').textContent = `${index+1} / ${htmlSlides.length}`;
  const label = labels[index];
  const parts = label.match(/^\d+\s(.+)$/);
  document.getElementById('slide-label').textContent = parts ? parts[1] : label;
  document.getElementById('progress').style.width = (((index+1) / htmlSlides.length) * 100) + '%';
}

function goToSlide(i) {
  if (i < 0 || i >= htmlSlides.length) return;
  currentSlide = i;
  renderSlide(i);
}
function nextSlide() { goToSlide(currentSlide + 1); }
function prevSlide() { goToSlide(currentSlide - 1); }
function toggleToc() { document.getElementById('toc-overlay').classList.toggle('open'); }
function closeToc() { document.getElementById('toc-overlay').classList.remove('open'); }
function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
  if (e.key === 'Escape') closeToc();
  if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  if (e.key === 't' || e.key === 'T') toggleToc();
  if (e.key === 'Home') goToSlide(0);
  if (e.key === 'End') goToSlide(htmlSlides.length - 1);
});

let tx = 0;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 50) dx < 0 ? nextSlide() : prevSlide();
});

window.addEventListener('resize', () => renderSlide(currentSlide));

renderSlide(0);
</script>
